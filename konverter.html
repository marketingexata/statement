<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konverter Pesan WhatsApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="p-3 sm:p-5 text-slate-800">

  <div class="max-w-3xl mx-auto space-y-4">
    <!-- Penjelasan Singkat -->
    <div class="bg-indigo-50 border border-indigo-200/80 rounded-xl p-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 text-xs text-indigo-950">
        <i data-lucide="wand-2" class="w-4 h-4 text-indigo-600 shrink-0"></i>
        <span>Tempel pesan mentah dari WhatsApp di kotak kiri/atas, hasil format otomatis siap disalin di kotak kanan/bawah.</span>
      </div>
      <button onclick="isiContoh()" class="shrink-0 px-2.5 py-1 rounded-lg bg-white hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-[11px] font-semibold transition">
        Coba Contoh
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- KOTAK INPUT PESAN MENTAH -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-3.5 flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <span class="w-5 h-5 rounded-md bg-slate-800 text-white text-[11px] flex items-center justify-center">1</span>
            Pesan Mentah WhatsApp
          </label>
          <div class="flex items-center gap-1">
            <button onclick="tempelClipboard()" class="px-2 py-1 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-semibold flex items-center gap-1 transition">
              <i data-lucide="clipboard-paste" class="w-3 h-3"></i> Tempel
            </button>
            <button onclick="resetKonverter()" class="px-2 py-1 rounded-md bg-rose-50 hover:bg-rose-100 text-rose-600 text-[11px] font-semibold transition">
              Hapus
            </button>
          </div>
        </div>
        <textarea
          id="rawInput"
          rows="11"
          oninput="konversiPesan()"
          placeholder="Tempel pesan mentah dari nasabah di sini..."
          class="w-full rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 p-2.5 text-xs font-mono bg-slate-50/60 outline-none resize-y"
        ></textarea>
      </div>

      <!-- KOTAK OUTPUT HASIL KONVERSI -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-3.5 flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold text-emerald-700 flex items-center gap-1.5">
            <span class="w-5 h-5 rounded-md bg-emerald-600 text-white text-[11px] flex items-center justify-center">2</span>
            Hasil Format (Siap Copy-Paste)
          </label>
          <span id="statusBadge" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">Menunggu input</span>
        </div>
        <textarea
          id="formattedOutput"
          rows="11"
          readonly
          placeholder="Hasil konversi 1-6 otomatis muncul di sini..."
          class="w-full rounded-lg border border-emerald-300 bg-emerald-50/30 p-2.5 text-xs font-mono text-slate-800 outline-none resize-y"
        ></textarea>

        <!-- Tombol Aksi Hasil -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
          <button onclick="salinHasil()" id="btnCopy" class="w-full py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm transition">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
            <span>Salin Hasil (Copy)</span>
          </button>
          <button onclick="kirimKeEditor()" class="w-full py-2 px-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm transition" title="Salin sekaligus tempel otomatis ke Editor E-Statement">
            <i data-lucide="send" class="w-3.5 h-3.5"></i>
            <span>Salin & Pakai di Editor</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function bersihkanNamaBank(val) {
      let s = String(val || '').trim();
      s = s.replace(/^(?:pt\.?\s*)?(?:bank\s+)/i, '').trim();
      return s.toUpperCase();
    }

    function konversiPesan() {
      const raw = document.getElementById('rawInput').value || '';
      const outEl = document.getElementById('formattedOutput');
      const badge = document.getElementById('statusBadge');

      if (!raw.trim()) {
        outEl.value = '';
        badge.textContent = 'Menunggu input';
        badge.className = 'text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500';
        return;
      }

      const data = {
        bank: '',
        alamatBank: '',
        cabang: '',
        noRek: '',
        namaPemilik: '',
        alamatRumah: ''
      };

      const lines = raw.split(/\r?\n/);
      let lastKey = null;

      lines.forEach(line => {
        // Buang timestamp/nama pengirim WA jika ada
        let clean = line
          .replace(/^\s*\[[^\]]{3,40}\]\s*[^:\n]{1,40}:\s*/, '')
          .replace(/^\s*\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4},?\s+\d{1,2}[.:]\d{2}\s*[-–]\s*[^:\n]{1,40}:\s*/, '')
          .replace(/[\u200B-\u200D\uFEFF\u00A0]/g, ' ')
          .trim();

        if (!clean) {
          lastKey = null;
          return;
        }

        // Abaikan baris kalimat pengantar atau kalimat penutup seperti "foto ktp indonesia"
        if (/^(jika kamu tidak ada|atau tidak ada|minta tolong isi|mohon isi|silakan isi|berikut data|foto ktp|lampirkan foto)/i.test(clean)) {
          lastKey = null;
          return;
        }

        // Cari pemisah ":" atau "="
        const match = clean.match(/^([^:=]{2,50}?)\s*[:=]\s*(.*)$/);
        if (match) {
          const label = match[1].toLowerCase().replace(/^[\d\.\)\-\*\s]+/, '').trim();
          const val = match[2].trim();

          if (/^(nama\s*bank|bank)$/i.test(label)) {
            data.bank = bersihkanNamaBank(val);
            lastKey = 'bank';
          } else if (/alamat\s*(cabang|kantor|unit|bank)|^alamat$/i.test(label) && !/rumah|ktp|domisili|terdaftar|indonesia|lengkap/i.test(label)) {
            data.alamatBank = val;
            lastKey = 'alamatBank';
          } else if (/(nama\s*cabang|kantor\s*cabang|cabang\s*bank|unit\s*kerja|^cabang$)/i.test(label)) {
            data.cabang = val;
            lastKey = 'cabang';
          } else if (/(nomer\s*rekening|nomor\s*rekening|no\.?\s*rekening|no\.?\s*rek|^rekening$)/i.test(label)) {
            data.noRek = val.replace(/\s+/g, '');
            lastKey = 'noRek';
          } else if (/(nama\s*lengkap|nama\s*pemilik|nama\s*pengguna|nama\s*rekening|atas\s*nama|^nama$)/i.test(label)) {
            data.namaPemilik = val;
            lastKey = 'namaPemilik';
          } else if (/alamat\s*(rumah|lengkap|ktp|domisili|indonesia|yang\s*terdaftar|sesuai)/i.test(label)) {
            data.alamatRumah = val;
            lastKey = 'alamatRumah';
          } else {
            lastKey = null;
          }
        } else if (lastKey && data[lastKey] !== undefined) {
          // Jika nilai ditulis menyambung ke baris bawahnya tanpa titik dua
          data[lastKey] = (data[lastKey] ? data[lastKey] + ' ' : '') + clean;
          if (lastKey === 'bank') data.bank = bersihkanNamaBank(data.bank);
        }
      });

      const hasil = [
        `1. Nama bank = ${data.bank}`,
        `2. Alamat bank = ${data.alamatBank}`,
        `3. Kantor cabang bank = ${data.cabang}`,
        `4. No. Rekening = ${data.noRek}`,
        `5. Nama pemilik rekening = ${data.namaPemilik}`,
        `6. Alamat lengkap indonesia = ${data.alamatRumah}`
      ].join('\n');

      outEl.value = hasil;
      badge.textContent = 'Terformat Otomatis';
      badge.className = 'text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700';
    }

    async function tempelClipboard() {
      const el = document.getElementById('rawInput');
      try {
        const t = await navigator.clipboard.readText();
        if (t) {
          el.value = t;
          konversiPesan();
          return;
        }
      } catch (_) {}
      el.focus();
    }

    function resetKonverter() {
      document.getElementById('rawInput').value = '';
      konversiPesan();
    }

    function isiContoh() {
      document.getElementById('rawInput').value = `Jika kamu tidak ada Buku tabungannya,
atau tidak ada Estatement Bank.
Minta tolong isi data dibawah ini :

NAMA BANK : bank bni

Nama cabang bank : bank bni bangli 

Alamat Cabang bank : Jl. Brigjen Ngurah Rai No.202, Kawan, Kec. Bangli, Kabupaten Bangli, Bali 80614

Alamat rumah yang terdaftar dibank : banjar kayuambua desa tiga kecamatan susut kabupaten bangli provinsi bali 

Nomer rekening : 2132531607

Nama lengkap pemilik rekening: Ni Ketut Darmini asih 

foto ktp indonesia`;
      konversiPesan();
    }

    async function salinHasil() {
      const outEl = document.getElementById('formattedOutput');
      if (!outEl.value) return;
      outEl.select();
      try {
        await navigator.clipboard.writeText(outEl.value);
      } catch (_) {
        document.execCommand('copy');
      }
      const btn = document.getElementById('btnCopy');
      const oldHtml = btn.innerHTML;
      btn.innerHTML = '<span>✓ Berhasil Disalin!</span>';
      setTimeout(() => { btn.innerHTML = oldHtml; if (window.lucide) lucide.createIcons(); }, 1500);
    }

    async function kirimKeEditor() {
      await salinHasil();
      const val = document.getElementById('formattedOutput').value;
      if (val && window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'APPLY_CONVERTED_WA', payload: val }, '*');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
